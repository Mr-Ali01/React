spring:
  config:
    activate:
      on-profile: test

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 1025

app:
  scheduling:
    enabled: false
  security:
    cookie:
      name: ACADLYTIC_SID
      secure: false
      same-site: Lax
      path: /
  bootstrap:
    super-admin:
      enabled: false

server:
  port: 0

logging:
  level:
    root: INFO
    com.acadlytic: INFO
    org.hibernate.SQL: WARN
