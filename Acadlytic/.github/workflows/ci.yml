name: CI

'on':
  push:
    branches: [main, master, 'phase/**', 'feature/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test Suite (MySQL 8 Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verify Docker Daemon Availability
        run: docker info

      - name: Run Backend Tests
        run: mvn -f backend/pom.xml clean test
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'false'

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend Quality & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Node Version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Code formatting check (Prettier)
        run: npm run format:check

      - name: Static lint check (ESLint)
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run Unit & Guard Test Suite (Vitest)
        run: npm run test

      - name: Build Production Bundle (Vite)
        run: npm run build
